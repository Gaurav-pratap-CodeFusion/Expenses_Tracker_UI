<!DOCTYPE html>
<html>

<head>
    <title>Expense List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Expense List</h2>

        <div id="list"></div>

        <br>
        <hr>

    </div>


    <script>

        let data = JSON.parse(localStorage.getItem("expenses")) || [];

        let output = "";

        for (let i = 0; i < data.length; i++) {
            output +=
                `
                <div class="card">

                <h4 style="color:green">${data[i].name}</h4>

                <p>Amount: ₹${data[i].amount}</p>

                <p>Date: ${data[i].date}</p>

                <p>${data[i].desc}</p>

                <a href="update-expense.html?id=${i}">Edit</a>

                </div>
                `;
        }

        list.innerHTML = output;

    </script>

</body>

</html>
