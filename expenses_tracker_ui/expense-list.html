<!DOCTYPE html>
<html>

<head>
<title>Expense List</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Expense List</h2>

<div id="list"></div>

</div>


<script>

async function loadExpenses()
{
        let response =
        await fetch("http://localhost:8080/expenses");

        let data = await response.json();

        let output = "";

        data.forEach(exp =>
        {
            output += `
            <div class="card">

            <h4 style="color:green">
            ${exp.name}
            </h4>

            <p>Amount: ₹${exp.amount}</p>

            <p>Date: ${exp.date}</p>

            <p>${exp.description}</p>

            <a href="update-expense.html?id=${exp.id}">
            Edit
            </a>

            </div>
            `;
        });

        document.getElementById("list").innerHTML = output;
}

loadExpenses();

</script>

</body>

</html>
