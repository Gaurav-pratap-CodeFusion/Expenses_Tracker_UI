<!DOCTYPE html>
<html>

<head>
    <title>Update Expense</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Update Expense</h2>

        <form onsubmit="updateExpense(event)">

            <label>Expense Name</label>
            <input type="text" id="name" required>

            <label>Amount</label>
            <input type="number" id="amount" required>

            <label>Date</label>
            <input type="date" id="date" required>

            <label>Description</label>
            <textarea id="desc"></textarea>

            <button>Update Expense</button>

        </form>

    </div>


    <script>

        let id = new URLSearchParams(location.search).get("id");

        async function loadExpense() {
            let response =
                await fetch(`http://localhost:8080/expenses/${id}`);

            let expense = await response.json();

            document.getElementById("name").value = expense.name;
            document.getElementById("amount").value = expense.amount;
            document.getElementById("date").value = expense.date;
            document.getElementById("desc").value = expense.description;
        }

        loadExpense();


        async function updateExpense(e) {
            e.preventDefault();

            let updatedExpense =
            {
                name: document.getElementById("name").value,
                amount: document.getElementById("amount").value,
                date: document.getElementById("date").value,
                description: document.getElementById("desc").value
            };

            let response = await fetch(`http://localhost:8080/expenses/${id}`,
                {
                    method: "PUT",

                    headers:
                    {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(updatedExpense)
                });

            if (response.ok) {
                alert("Expense updated successfully");
                location.href = "expense-list.html";
            }
            else {
                alert("Update failed");
            }
        }

    </script>

</body>

</html>
